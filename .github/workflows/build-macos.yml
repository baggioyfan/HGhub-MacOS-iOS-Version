name: Build macOS Release

# 手动触发时可任选要构建的架构（可多选）；推送到 main 默认只构建 Apple Silicon。
on:
  workflow_dispatch:
    inputs:
      build_arm64:
        description: "Apple Silicon (arm64) → HGhub_<ver>_arm64.dmg"
        type: boolean
        default: true
      build_x64:
        description: "Intel (x64) → HGhub_<ver>_x64.dmg"
        type: boolean
        default: false
      build_universal:
        description: "通用双架构版 (universal) → HGhub_<ver>_universal.dmg"
        type: boolean
        default: false
  push:
    branches: ["main"]

jobs:
  # 根据触发方式与勾选项生成构建矩阵：勾几个就建几个
  plan:
    name: 规划构建目标
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      archs: ${{ steps.plan.outputs.archs }}
    steps:
      - name: 解析构建目标
        id: plan
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            A="${{ inputs.build_arm64 }}"
            X="${{ inputs.build_x64 }}"
            U="${{ inputs.build_universal }}"
            echo "触发方式: 手动触发 (arm64=$A x64=$X universal=$U)"
          else
            # push 到 main：只出 Apple Silicon 包，其余按需手动补建
            A="true"; X="false"; U="false"
            echo "触发方式: push → 默认仅构建 arm64"
          fi

          items=()
          archs=()
          if [[ "$A" == "true" ]]; then
            items+=('{"target":"aarch64-apple-darwin","name":"Apple Silicon (arm64)","arch":"arm64"}')
            archs+=("arm64")
          fi
          if [[ "$X" == "true" ]]; then
            items+=('{"target":"x86_64-apple-darwin","name":"Intel (x64)","arch":"x64"}')
            archs+=("x64")
          fi
          if [[ "$U" == "true" ]]; then
            items+=('{"target":"universal-apple-darwin","name":"Universal (通用版)","arch":"universal"}')
            archs+=("universal")
          fi

          if [ "${#items[@]}" -eq 0 ]; then
            echo "::error::未勾选任何构建目标，请在手动触发时至少选择一种架构"
            exit 1
          fi

          matrix="{\"include\":[$(IFS=,; echo "${items[*]}")]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "archs=$(IFS=,; echo "${archs[*]}")" >> "$GITHUB_OUTPUT"
          echo "构建矩阵: $matrix"

  macos:
    name: macOS (${{ matrix.name }})
    needs: plan
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: 对齐版本号
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.target }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 macOS 应用 (DMG + APP)
        run: |
          pnpm tauri build --config src-tauri/tauri.macos.conf.json --target ${{ matrix.target }}

      - name: 整理构建产物
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p artifacts
          
          # 收集 dmg 安装包
          found_dmg=0
          for f in $(find src-tauri/target -name '*.dmg'); do
            echo "发现 DMG: $f"
            cp "$f" "artifacts/HGhub_${V}_${{ matrix.arch }}.dmg"
            found_dmg=1
          done
          
          # 打包 .app 绿色压缩包（便于不需要 DMG 安装的用户直接拖拽）
          for app in $(find src-tauri/target -name 'HGhub.app' -type d); do
            echo "发现 APP: $app"
            tar -czf "artifacts/HGhub_${V}_${{ matrix.arch }}.app.tar.gz" -C "$(dirname "$app")" "HGhub.app"
          done
          
          ls -lh artifacts/
          if [ "$found_dmg" -eq 0 ]; then
            echo "::error::未找到 DMG 构建产物"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-macOS-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: 发布 GitHub Release
    needs: [plan, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有 macOS 产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 查看产物列表
        run: ls -lh artifacts

      - name: 获取版本号
        id: ver
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 生成下载说明
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ARCHS: ${{ needs.plan.outputs.archs }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          ARCHS="$RUN_ARCHS"

          # 合并 Release 上已存在的同版本安装包，避免增量构建后说明与实际附件不符
          EXIST="$(gh release view "v${V}-macos" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          for a in arm64 x64 universal; do
            if echo "$EXIST" | grep -q "HGhub_${V}_${a}.dmg"; then
              case ",$ARCHS," in *",$a,"*) ;; *) ARCHS="${ARCHS},${a}" ;; esac
            fi
          done
          ARCHS="${ARCHS#,}"

          DL="" MISSING=""
          case ",$ARCHS," in *,arm64,*) DL="${DL}- **Apple Silicon (M1/M2/M3/M4 系列芯片)**: 推荐下载 \`HGhub_${V}_arm64.dmg\`"$'\n';; esac
          case ",$ARCHS," in *,x64,*) DL="${DL}- **Intel 芯片**: 推荐下载 \`HGhub_${V}_x64.dmg\`"$'\n';; esac
          case ",$ARCHS," in *,universal,*) DL="${DL}- **通用双架构版 (全机型支持)**: 推荐下载 \`HGhub_${V}_universal.dmg\`"$'\n';; esac
          for a in arm64 x64 universal; do
            case ",$ARCHS," in
              *",$a,"*) ;;
              *) MISSING="${MISSING}\`$a\` " ;;
            esac
          done
          if [ -n "$MISSING" ]; then
            DL="${DL}"$'\n'"本次未构建：${MISSING}——需要时在 Actions 里手动触发「Build macOS Release」并勾选对应架构即可补发。"$'\n'
          fi
          {
            echo 'dl<<EOF'
            echo "$DL"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-macos
          name: HGhub v${{ steps.ver.outputs.version }} macOS 专属版
          body: |
            ## HGhub macOS 编译发布版 (v${{ steps.ver.outputs.version }})

            本项目为 [Minireel/HGhub](https://github.com/Minireel/HGhub) 官方源码针对 macOS 平台的编译产物。
            原项目已在 PR #1 完成 macOS 适配支持，但官方尚未在 Release 页面发布 Mac 版产物。

            ### ✨ v${{ steps.ver.outputs.version }} 增强特性
            - **多档位 GPU 实时视频超分引擎（WebGL2 / Apple Metal）**：桌面端底部控制栏内置「自然清透 / 影院质感 / 超清锐利 / 漫剧锐线 / 二次元重绘 / 原画直通」6 档实时画质超分选单，支持静帧与播放中一键对比。
            - **全功能媒体网关与原生交互**：支持最新鉴权播放接口、原生叠加红绿灯标题栏、影院模式、画中画及深浅主题切换。

            ### 下载说明
            ${{ steps.notes.outputs.dl }}
            ### macOS 首次打开说明（绕过未签名提示）
            由于开源个人构建未购买苹果开发者企业证书签名与公证，首次打开若提示“已损坏”或“无法打开”，请在「终端」中执行以下命令清除隔离属性：
            ```bash
            sudo xattr -rd com.apple.quarantine /Applications/HGhub.app
            ```
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
